name: Veille médicale quotidienne

on:
  schedule:
    # 7h Paris (5h UTC en été, 6h UTC en hiver). Note: GitHub peut décaler de plusieurs heures aux heures de pointe.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (auto = email + audio si mardi/vendredi)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - email
          - audio

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts

      - name: Détermination de l'URL podcast
        id: podcast_url
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          echo "url=https://${OWNER}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Exécution de la veille
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PODCAST_BASE_URL: ${{ steps.podcast_url.outputs.url }}
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/veille.py

      - name: Commit & push des nouveaux épisodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain podcast/)" ]; then
            git add podcast/
            git commit -m "Nouvel épisode podcast $(date +%Y-%m-%d)"
            git push
            echo "Épisode poussé"
          else
            echo "Pas de nouvel épisode à publier"
          fi
